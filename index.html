<head>

  <!-- Leaflet CSS (OpenStreetMap 免 API Key) -->

  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #334155;
      --border: #475569;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --eneos: #f97316;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .title-group h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .title-group p { font-size: 0.82rem; color: var(--muted); }
    .badge-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 600;
    }
    .badge.eneos {
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
      border-color: rgba(249, 115, 22, 0.35);
    }

    /* 主版面配置 */
    .layout {
      display: grid;
      grid-template-columns: 430px 1fr;
      height: calc(100vh - 68px);
      min-height: 640px;
    }
    @media (max-width: 960px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      .map-pane { height: 460px; order: -1; }
    }

    /* 左側行程與油站控制欄 */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .day-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 10px 12px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
    }
    .day-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .day-btn:hover { color: #fff; border-color: var(--accent); }
    .day-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
    .day-btn.gas-tab.active {
      background: var(--eneos);
      color: #fff;
      border-color: var(--eneos);
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 景點與油站卡片 */
    .item-card {
      background: rgba(51, 65, 85, 0.55);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .item-card:hover {
      border-color: var(--accent);
      background: rgba(51, 65, 85, 0.9);
    }
    .item-card.gas-card {
      border-left: 4px solid var(--eneos);
    }
    .item-card.spot-card {
      border-left: 4px solid var(--accent);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }
    .card-title { font-weight: 700; font-size: 0.95rem; color: #fff; }
    .card-tag {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
    }
    .tag-day { background: #334155; color: #bae6fd; }
    .tag-24h { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }
    .tag-warn { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
    .card-desc { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 8px; }
    .card-meta {
      font-size: 0.75rem;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .action-btn {
      font-size: 0.74rem;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #e2e8f0;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.primary {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }

    /* 入油指南與計算機盒 */
    .fuel-box {
      background: #0f172a;
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 0.78rem;
    }
    .nozzle-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    .nozzle {
      padding: 5px 6px;
      border-radius: 6px;
      text-align: center;
      font-weight: 700;
      font-size: 0.72rem;
    }
    .nozzle.red { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
    .nozzle.yellow { background: rgba(234, 179, 8, 0.15); border: 1px solid #eab308; color: #fde047; }
    .nozzle.green { background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #86efac; }

    /* 右側地圖區 */
    .map-pane {
      position: relative;
      width: 100%;
      height: 100%;
      background: #0b1120;
      overflow: hidden;
    }
    .map-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.9);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .mode-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    #osm-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }
    #svg-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #svg-map.visible {
      z-index: 20;
      opacity: 1;
      pointer-events: auto;
    }

    /* 自訂油站與景點地圖標記 */
    .custom-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      border: 2px solid #fff;
    }
    .pin-spot { background: #0284c7; }
    .pin-gas { background: #ea580c; border-radius: 6px; }

    /* Toast 提示 */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 9999;
      display: none;
      font-size: 0.85rem;
    }
  </style>
</head>

    let map = null;
    let markersLayer = null;
    let routeLine = null;
    let markerDict = {};
    let currentFilter = "ALL";

    // 初始化 OpenStreetMap
    function initMap() {
      map = L.map("osm-map", {
        center: [35.32, 139.25],
        zoom: 9,
        zoomControl: true
      });

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      renderAll("ALL");

      // 修正 iframe / Google Sites 載入時尺寸計算
      setTimeout(() => {
        if (map) map.invalidateSize();
      }, 350);
    }

    // 渲染左邊卡片及地圖標記
    function renderAll(filter) {
      currentFilter = filter;
      const listEl = document.getElementById("cardList");
      listEl.innerHTML = "";
      markersLayer.clearLayers();
      markerDict = {};

      const filtered = ITEMS.filter(item => {
        if (filter === "ALL") return true;
        if (filter === "GAS") return item.type === "gas";
        return item.day === filter;
      });

      const routeCoords = [];

      filtered.forEach((item, idx) => {
        const isGas = item.type === "gas";
        if (!isGas || filter === "GAS") {
          routeCoords.push([item.lat, item.lng]);
        }

        // 建立地圖 Icon
        const iconHtml = `<div class="custom-pin ${isGas ? 'pin-gas' : 'pin-spot'}" style="width:28px;height:28px;">${isGas ? '⛽' : (idx + 1)}</div>`;
        const customIcon = L.divIcon({
          html: iconHtml,
          className: "",
          iconSize: [28, 28],
          iconAnchor: [14, 14],
          popupAnchor: [0, -14]
        });

        const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
        const popupHtml = `
          <div style="font-family:sans-serif; min-width:210px; color:#0f172a;">
            <div style="font-weight:700; font-size:14px; margin-bottom:4px;">${item.name}</div>
            <div style="font-size:12px; color:#475569; margin-bottom:6px;">${item.time} ｜ 🕒 ${item.hours}</div>
            <div style="font-size:12px; background:#f1f5f9; padding:5px; border-radius:4px; margin-bottom:6px;">
              <strong>📞 車機電話：</strong>${item.tel}
            </div>
            <div style="font-size:12px; margin-bottom:8px;">${item.desc}</div>
            <a href="${gmapUrl}" target="_blank" rel="noopener" style="display:inline-block; background:#0284c7; color:#fff; text-decoration:none; padding:5px 10px; border-radius:5px; font-size:12px; font-weight:bold;">📍 用 Google Maps 打開</a>
          </div>
        `;

        const marker = L.marker([item.lat, item.lng], { icon: customIcon })
          .bindPopup(popupHtml)
          .addTo(markersLayer);

        markerDict[item.id] = marker;

        // 建立左側卡片
        const card = document.createElement("div");
        card.className = `item-card ${isGas ? "gas-card" : "spot-card"}`;
        card.id = `card-${item.id}`;
        card.onclick = () => focusItem(item.id);

        let badgeHtml = `<span class="card-tag tag-day">5月${item.day}日</span>`;
        if (isGas && item.is24h) badgeHtml = `<span class="card-tag tag-24h">24H 自助營業</span>`;
        if (isGas && item.warn) badgeHtml = `<span class="card-tag tag-warn">⚠️ 週四注意早關</span>`;

        card.innerHTML = `
          <div class="card-header">
            <div class="card-title">${item.name}</div>
            ${badgeHtml}
          </div>
          <div class="card-desc">${item.desc}</div>
          <div class="card-meta">
            🕒 營業/時間：${item.hours}<br>
            📞 車機電話 (Car Navi)：<strong>${item.tel}</strong>
          </div>
          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="action-btn primary" onclick="copyTel('${item.tel}')">📋 複製車機電話</button>
            <a class="action-btn" href="${gmapUrl}" target="_blank" rel="noopener">🗺️ Google Maps 導航</a>
          </div>
        `;
        listEl.appendChild(card);
      });

      // 畫路線折線
      if (routeLine) {
        map.removeLayer(routeLine);
      }
      if (routeCoords.length > 1) {
        routeLine = L.polyline(routeCoords, {
          color: filter === "GAS" ? "#f97316" : "#38bdf8",
          weight: 4,
          opacity: 0.85,
          dashArray: "8, 6"
        }).addTo(markersLayer);
      }

      fitAllMarkers();
    }

    function filterItems(filter, btnEl) {
      document.querySelectorAll(".day-btn").forEach(b => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
      renderAll(filter);
    }

    function focusItem(id) {
      const item = ITEMS.find(x => x.id === id);
      if (!item) return;

      // 如在 SVG 模式撳卡片，自動切返去 OSM 地圖並對焦
      switchMapMode("osm");

      setTimeout(() => {
        map.invalidateSize();
        map.setView([item.lat, item.lng], 13, { animate: true });
        if (markerDict[id]) {
          markerDict[id].openPopup();
        }
      }, 60);
    }

    function selectById(id) {
      focusItem(id);
      const cardEl = document.getElementById(`card-${id}`);
      if (cardEl) {
        cardEl.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    function fitAllMarkers() {
      const markers = Object.values(markerDict);
      if (markers.length > 0 && map) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.15));
      }
    }

    function switchMapMode(mode) {
      const svgEl = document.getElementById("svg-map");
      const btnOsm = document.getElementById("btnOsm");
      const btnSvg = document.getElementById("btnSvg");

      if (mode === "svg") {
        svgEl.classList.add("visible");
        btnSvg.classList.add("active");
        btnOsm.classList.remove("active");
      } else {
        svgEl.classList.remove("visible");
        btnOsm.classList.add("active");
        btnSvg.classList.remove("active");
        setTimeout(() => {
          if (map) map.invalidateSize();
        }, 80);
      }
    }

    function copyTel(tel) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(tel);
      } else {
        const ta = document.createElement("textarea");
        ta.value = tel;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      const toast = document.getElementById("toast");
      toast.textContent = `✅ 已複製車機電話：${tel}`;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 2200);
    }

    window.addEventListener("DOMContentLoaded", initMap);
    window.addEventListener("resize", () => { if (map) map.invalidateSize(); });
  </script>
